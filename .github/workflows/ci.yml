name: Image Playground CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [master, 'codex/**']
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 标题/正文编辑单独排队，目标分支变化继续使用代码检查队列。
  group: qintopia-image-ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}
  cancel-in-progress: true

jobs:
  check:
    name: Node and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      account-database:
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: image_test_root
          POSTGRES_PASSWORD: synthetic-local-db-only
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:32768:5432
        options: >-
          --name image-playground-acceptance-pg
          --label codex.project=image-generation-playground
          --label codex.task=01a17dff-bdc4-7712-9e0a-e553ae2240d6
          --health-cmd "pg_isready -U image_test_root -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://image.qintopia.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test:pr
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prepare isolated account database
        run: node scripts/database/bootstrap-local.mjs
      - name: Verify database identity and migration boundaries
        env:
          IMAGE_DATABASE_INTEGRATION: '1'
        run: pnpm test:database
      - name: Verify account lifecycle and session revocation
        env:
          IMAGE_AUTH_TEST_DATABASE_URL: postgresql://qintopia_image_app:synthetic-local-runtime-only@127.0.0.1:32768/qintopia_image
        run: pnpm test:auth
      - name: Verify encrypted provider configuration and authorization
        env:
          IMAGE_PROVIDER_TEST_DATABASE_URL: postgresql://qintopia_image_app:synthetic-local-runtime-only@127.0.0.1:32768/qintopia_image
        run: pnpm test:provider
      - name: Verify atomic generation admission and idempotency
        env:
          IMAGE_ADMISSION_TEST_DATABASE_URL: postgresql://qintopia_image_app:synthetic-local-runtime-only@127.0.0.1:32768/qintopia_image
        run: pnpm test:admission
      - name: Verify private workspace ownership and save recovery
        env:
          IMAGE_PRIVATE_WORKSPACE_TEST_DATABASE_URL: postgresql://qintopia_image_app:synthetic-local-runtime-only@127.0.0.1:32768/qintopia_image
        run: pnpm test:workspace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify BMad runtime offline
        run: python3 -B -m unittest discover -s _bmad/tests -v
      - name: Install pinned COS SDK for offline transport tests
        run: python3 -m pip install --disable-pip-version-check --no-input -r scripts/release/requirements.txt
      - run: pnpm test:release
      - run: pnpm build
      - name: Verify built account routes without cloud services
        env:
          IMAGE_ACCOUNT_HTTP_INTEGRATION: '1'
        run: pnpm test:account-http
      - name: Verify built private workspace with synthetic model and memory COS
        env:
          IMAGE_PRIVATE_HTTP_ACCEPTANCE: '1'
        run: pnpm test:private-http
      - name: Smoke test the Linux standalone artifact
        run: python3 scripts/release/smoke.py --source-root .
