name: Image Playground CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qintopia-image-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: https://image.qintopia.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm test:pr
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm build
      - name: Smoke test the Linux standalone artifact
        run: python3 scripts/release/smoke.py --source-root .
