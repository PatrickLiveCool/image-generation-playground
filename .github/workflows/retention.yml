name: Image Playground Retention

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview retained releases without deleting any resources
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: qintopia-image-production
  cancel-in-progress: false

jobs:
  maintenance:
    name: Retain releases with current and previous versions protected
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned COS client for retention
        run: python3 -m pip install --disable-pip-version-check --no-input -r scripts/release/requirements.txt
      - name: Materialize restricted SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/qintopia-image-retention-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/qintopia-image-retention-hosts"
      - name: Run protected release retention
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/qintopia-image-retention-key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/qintopia-image-retention-hosts
          RETENTION_DRY_RUN: ${{ inputs.dry_run }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_ENDPOINT: ${{ vars.COS_ENDPOINT }}
          RETENTION_COS_SECRET_ID: ${{ secrets.RETENTION_COS_SECRET_ID }}
          RETENTION_COS_SECRET_KEY: ${{ secrets.RETENTION_COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          case "$RETENTION_DRY_RUN" in
            true) python3 scripts/release/orchestrate.py maintenance --dry-run ;;
            false) python3 scripts/release/orchestrate.py maintenance --apply ;;
            *) echo 'Choose an explicit retention mode.' >&2; exit 1 ;;
          esac
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/qintopia-image-retention-key" "$RUNNER_TEMP/qintopia-image-retention-hosts"
