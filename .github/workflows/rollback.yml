name: Image Playground Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: Previously successful compatible version, for example v0.2.0
        required: true
        type: string
      revision:
        description: Full 40-character commit SHA from that release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qintopia-image-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore a verified compatible release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      COS_BUCKET: ${{ vars.COS_BUCKET }}
      COS_REGION: ${{ vars.COS_REGION }}
      COS_ENDPOINT: ${{ vars.COS_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned COS client
        run: python3 -m pip install --disable-pip-version-check --no-input -r scripts/release/requirements.txt
      - name: Fetch and verify the existing rollback bundle
        id: bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ inputs.revision }}
          READ_COS_SECRET_ID: ${{ secrets.UPLOAD_COS_SECRET_ID }}
          READ_COS_SECRET_KEY: ${{ secrets.UPLOAD_COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/qintopia-image-rollback.XXXXXX")"
          python3 scripts/release/cos.py fetch --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --directory "$directory"
          manifest_sha="$(sha256sum "$directory/manifest.json" | awk '{print $1}')"
          printf 'manifest_sha=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
      - name: Materialize restricted SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/qintopia-image-rollback-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/qintopia-image-rollback-hosts"
      - name: Roll back through the restricted server entry
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/qintopia-image-rollback-key
          DEPLOY_KNOWN_HOSTS_FILE: ${{ runner.temp }}/qintopia-image-rollback-hosts
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_MANIFEST_SHA: ${{ steps.bundle.outputs.manifest_sha }}
          UPLOAD_COS_SECRET_ID: ${{ secrets.UPLOAD_COS_SECRET_ID }}
          UPLOAD_COS_SECRET_KEY: ${{ secrets.UPLOAD_COS_SECRET_KEY }}
          APP_PUBLIC_URL: https://image.qintopia.cn
        run: |
          set -euo pipefail
          python3 scripts/release/orchestrate.py rollback --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --key "qintopia-image/releases/$RELEASE_VERSION/$RELEASE_REVISION/" --manifest-sha "$RELEASE_MANIFEST_SHA"
          printf 'Rollback %s at %s: compatibility, identity and health verified.\n' "$RELEASE_VERSION" "$RELEASE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary bundle and credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/qintopia-image-rollback-key" "$RUNNER_TEMP/qintopia-image-rollback-hosts"
          rm -rf -- "$RUNNER_TEMP/qintopia-image-rollback."*
